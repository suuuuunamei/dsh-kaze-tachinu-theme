<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <!-- Kaze Tachinu (The Wind Rises) horizontal mark — original vector artwork.
       Red-winged aeroplane + serif wordmark. Transparent background. -->
  <title>The Wind Rises</title>
  <!-- trailing wind streaks -->
  <path d="M70 84 C 30 84, 14 90, 4 97" fill="none" stroke="#F4F8FC" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 118 C 34 118, 20 112, 8 106" fill="none" stroke="#F4F8FC" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round"/>
  <!-- upper wing -->
  <rect x="88" y="46" width="196" height="28" rx="14" fill="#D9554F"/>
  <!-- wing struts -->
  <rect x="140" y="74" width="9" height="48" rx="4.5" fill="#F4F8FC" opacity="0.92"/>
  <rect x="222" y="74" width="9" height="48" rx="4.5" fill="#F4F8FC" opacity="0.92"/>
  <!-- fuselage -->
  <rect x="118" y="88" width="196" height="32" rx="16" fill="#F4F8FC"/>
  <!-- cockpit -->
  <rect x="196" y="84" width="52" height="16" rx="8" fill="#DDE7F0" opacity="0.9"/>
  <!-- tail fin -->
  <rect x="92" y="60" width="22" height="58" rx="11" fill="#D9554F"/>
  <!-- lower wing -->
  <rect x="150" y="128" width="162" height="22" rx="11" fill="#D9554F"/>
  <!-- propeller disc -->
  <circle cx="322" cy="104" r="17" fill="#F4F8FC"/>
  <circle cx="322" cy="104" r="6" fill="#D9554F"/>
  <!-- wordmark -->
  <text x="392" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" letter-spacing="6" fill="#F4F8FC">The Wind Rises</text>
  <text x="398" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="14" fill="#9FC4E8">KAZE TACHINU</text>
</svg>
